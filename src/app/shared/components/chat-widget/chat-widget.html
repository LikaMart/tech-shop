<!-- Chat Toggle Button -->
<button class="chat-toggle" (click)="toggleChat()" [class.open]="isOpen()">
  @if (isOpen()) {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  } @else {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    @if (messages().length > 1) {
      <span class="unread-dot"></span>
    }
  }
</button>

<!-- Chat Window -->
@if (isOpen()) {
  <div class="chat-window">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-info">
        <div class="bot-avatar">⚡</div>
        <div>
          <div class="bot-name">TechShop AI</div>
          <div class="bot-status">
            <span class="status-dot"></span> ონლაინ
          </div>
        </div>
      </div>
      <button class="btn-close" (click)="toggleChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #messagesContainer>
      @for (msg of messages(); track $index) {
        <div class="message-row" [class.user-row]="msg.role === 'user'">
          @if (msg.role === 'bot') {
            <div class="msg-avatar">⚡</div>
          }
          <div class="message" [class.user-msg]="msg.role === 'user'" [class.bot-msg]="msg.role === 'bot'">
            <p>{{ msg.text }}</p>
            <span class="msg-time">{{ formatTime(msg.time) }}</span>
          </div>
        </div>
      }

      @if (isLoading()) {
        <div class="message-row">
          <div class="msg-avatar">⚡</div>
          <div class="message bot-msg typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      }
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        placeholder="დაწერე შეტყობინება..."
        [value]="userInput()"
        (input)="userInput.set($any($event.target).value)"
        (keydown)="onKeyDown($event)"
        [disabled]="isLoading()"
      />
      <button
        class="btn-send"
        (click)="sendMessage()"
        [disabled]="!userInput().trim() || isLoading()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
}
