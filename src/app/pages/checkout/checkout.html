<div class="checkout-container">
  <!-- Step 1: User Info -->
  <form [formGroup]="form" *ngIf="step() === 1" class="checkout-form">
    <h2>მომხმარებლის ინფორმაცია</h2>

    <div class="form-group">
      <label>სახელი</label>
      <input formControlName="firstName" />
      <small *ngIf="f.firstName.touched && f.firstName.invalid">მინიმუმ 2 სიმბოლო</small>
    </div>

    <div class="form-group">
      <label>გვარი</label>
      <input formControlName="lastName" />
    </div>

    <div class="form-group">
      <label>ელ.ფოსტა</label>
      <input formControlName="email" type="email" />
    </div>

    <div class="form-group">
      <label>ტელეფონი</label>
      <input formControlName="phone" />
    </div>

    <div class="form-group">
      <label>მისამართი</label>
      <input formControlName="address" />
    </div>

    <div class="form-group">
      <label>ქალაქი</label>
      <input formControlName="city" />
    </div>

    <div class="form-group">
      <label>Zipcode</label>
      <input formControlName="zipcode" />
    </div>

    <button type="button" class="btn-primary" (click)="nextStep()">გაგრძელება</button>
  </form>

  <!-- Step 2: Payment Info -->
  <form [formGroup]="form" *ngIf="step() === 2" class="checkout-form">
    <h2>გადახდის ინფორმაცია</h2>

    <div class="form-group">
      <label>ბარათის ნომერი</label>
      <input formControlName="cardNumber" (input)="formatCardNumber($event)" />
    </div>

    <div class="form-group">
      <label>ვადის გასვლა</label>
      <input formControlName="cardExpiry" (input)="formatExpiry($event)" />
    </div>

    <div class="form-group">
      <label>CVV</label>
      <input formControlName="cardCvv" />
    </div>

    <button type="button" class="btn-success" (click)="placeOrder()" [disabled]="isLoading()">შეკვეთის გაფორმება</button>
  </form>

  <!-- Success Message -->
  <div *ngIf="isSuccess()" class="success-message">
    ✅ შეკვეთა წარმატებით გაფორმდა!
  </div>
</div>
